<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stylish Toggle</title>

    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./pagepwa.webmanifest" />
  </head>
  <body>
    <div class="switch">
      <input
        type="checkbox"
        name="toggle"
        id="cb"
        onclick="onCbClicked(checked)"
        onchange="onCbCheckChanged(checked)"
      />

      <label for="toggle">
        <i class="bulb">
          <span class="bulb-center"></span>
          <span class="filament-1"></span>
          <span class="filament-2"></span>
          <span class="reflections">
            <span></span>
          </span>

          <span class="sparks">
            <i class="spark-1"></i>
            <i class="spark-2"></i>
            <i class="spark-3"></i>
            <i class="spark-4"></i>
          </span>
        </i>
      </label>
    </div>

    <footer>
      <div class="footer">
        &copy; 2026 Copyright. All Rights Reserved. <br />
        Made by <span>Duskborne</span> and <span>Arhaan</span>
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
